<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#141A33" />
    <meta name="color-scheme" content="dark" />
    <title>WEAVEFALL</title>
    <!-- no favicon request: served over http(s) the browser would ask for /favicon.ico and log a 404 (test:origins) -->
    <link rel="icon" href="data:," />
    <style>
      /* critical boot styles — visible before the bundle runs */
      html, body { margin: 0; height: 100%; background: #141a33; overflow: hidden; }
      #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
        background: radial-gradient(120% 90% at 50% 30%, #2a2156 0%, #141a33 55%, #090b18 100%); color: #e8c46a; z-index: 50; transition: opacity .5s ease; font-family: Georgia, serif; }
      #boot .logo { font-size: clamp(36px, 10vw, 84px); letter-spacing: .16em; font-weight: 700;
        background: linear-gradient(180deg, #fff6d8 0%, #e8c46a 50%, #9a7425 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
        filter: drop-shadow(0 4px 18px rgba(232, 196, 106, .35)); }
      #boot .bar { width: min(62vw, 320px); height: 4px; border-radius: 4px; background: rgba(255, 255, 255, .08); overflow: hidden; box-shadow: inset 0 0 0 1px rgba(232, 196, 106, .25); }
      #boot .bar i { display: block; height: 100%; width: 4%; background: linear-gradient(90deg, #9a7425, #e8c46a, #fff2c4); transition: width .25s ease; border-radius: 4px; }
      #boot .tip { color: #aeb8d6; font: 14px/1.4 system-ui, sans-serif; max-width: 80vw; text-align: center; min-height: 1.4em; }
      #boot.hide { opacity: 0; pointer-events: none; }
    </style>
    <script defer src="./game.js"></script>
    <link rel="stylesheet" href="./assets/style.css">
  </head>
  <body>
    <div id="app">
      <div id="stage"></div>
      <div id="ui"></div>
    </div>
    <div id="boot" role="status" aria-label="Loading WEAVEFALL">
      <div class="logo">WEAVEFALL</div>
      <div class="bar"><i id="boot-bar"></i></div>
      <div class="tip" id="boot-tip">Every story is a thread.</div>
    </div>
    <script src="packs/manifest.js" onerror="window.__WF_ASSET_MANIFEST__={packs:{}}"></script>
    <script src="audio/music-manifest.js" onerror="window.__WF_MUSIC__={}"></script>
  </body>
</html>
